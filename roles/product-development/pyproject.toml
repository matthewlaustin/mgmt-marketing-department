[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pool-geek-data-specialist"
version = "0.1.0"
description = "Manufacturer product data for Pool Geek: SKUs, titles, specs, parts, manuals and photos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
product-namer = "product_namer.cli:main"

[tool.setuptools.packages.find]
include = ["product_namer*"]
